name: Verus smoke proof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned Rust and Verus releases
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --no-self-update
          bash scripts/install-verus.sh
      - name: Verify the proof and require the invalid proof to fail
        run: bash scripts/check-proof-ci.sh
      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase0-proof-${{ github.sha }}
          path: target/phase0-proof/*.log
